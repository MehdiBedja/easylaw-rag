<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyLaw — Algerian legal assistant</title>
<meta name="description" content="Ask questions about Algerian law in Arabic or French. Answers grounded in the Journal officiel, with cited sources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5d44'/%3E%3Cpath d='M16 7v17M10 24h12M8 11h16M8 11l-3 7h6zM24 11l-3 7h6z' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --panel-2: #fafbf9; --ink: #121a17; --ink-2: #3b4642; --muted: #6b7571;
    --line: #e2e6e3; --line-2: #eef1ef;
    --accent: #0b5d44; --accent-2: #0f7a59; --accent-ink: #ffffff; --accent-soft: #e6f2ed; --accent-line: #bfdccf;
    --warn: #8a5200; --warn-soft: #fdf3e1; --warn-line: #f0d9ad;
    --bad: #a3261b; --bad-soft: #fdecea; --bad-line: #f3c7c2;
    --user: #0b5d44; --user-ink: #ffffff;
    --shadow: 0 1px 2px rgba(16, 24, 20, .04), 0 4px 16px rgba(16, 24, 20, .05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1311; --panel: #161c19; --panel-2: #131916; --ink: #e8ece9; --ink-2: #c3cbc7; --muted: #8e9893;
      --line: #252e2a; --line-2: #1d2421;
      --accent: #4cc398; --accent-2: #6ad2ab; --accent-ink: #06120d; --accent-soft: #15291f; --accent-line: #24493a;
      --warn: #f2b65a; --warn-soft: #2b2312; --warn-line: #4a3a17;
      --bad: #f08a7e; --bad-soft: #2d1714; --bad-line: #522824;
      --user: #1f6f55; --user-ink: #f2fbf7;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font: 15.5px/1.75 "Inter", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[lang=ar] body { font-family: "IBM Plex Sans Arabic", "Inter", "Segoe UI", Tahoma, sans-serif; font-size: 16px; line-height: 1.9; }
  button, select, textarea, input { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .mark svg { width: 20px; height: 20px; }
  .brand b { font-size: 16px; letter-spacing: -.01em; display: block; line-height: 1.2; }
  .brand small { font-size: 12px; color: var(--muted); display: block; line-height: 1.3; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--panel-2); }
  .seg button { border: 0; background: none; padding: 3px 11px; border-radius: 7px; font-size: 13px; color: var(--muted); cursor: pointer; line-height: 1.6; }
  .seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 4px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; text-decoration: none; line-height: 1.6; }
  .ghost:hover { border-color: var(--muted); color: var(--ink); }
  .ghost svg { width: 15px; height: 15px; }

  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .col { max-width: 840px; margin: 0 auto; padding: 0 20px; }

  /* Banner (cold start) */
  .banner { display: none; max-width: 840px; margin: 14px auto 0; padding: 0 20px; }
  .banner div { background: var(--warn-soft); border: 1px solid var(--warn-line); color: var(--warn); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; }
  .banner.on { display: block; }

  /* Welcome */
  .welcome { padding: 7vh 0 3vh; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 99px; padding: 2px 12px; }
  .welcome h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.2; letter-spacing: -.02em; margin: 16px 0 10px; }
  .welcome .lead { color: var(--ink-2); font-size: 16.5px; margin: 0 0 22px; max-width: 640px; }
  .features { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 30px; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); }
  .features li { display: inline-flex; align-items: center; gap: 7px; }
  .features svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  html[lang=ar] .label { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .examples { grid-template-columns: 1fr; } }
  .examples button { text-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; line-height: 1.55; cursor: pointer; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; }
  .examples button:hover { border-color: var(--accent-line); background: var(--panel-2); }
  .examples .tag { flex: none; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 6px; margin-top: 2px; }

  /* Messages */
  .thread { padding: 24px 0 12px; }
  .msg { margin: 0 0 20px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--user); color: var(--user-ink); border-radius: 16px 16px 4px 16px; padding: 9px 16px; max-width: 82%; white-space: pre-wrap; unicode-bidi: plaintext; }
  html[dir=rtl] .msg.user .bubble { border-radius: 16px 16px 16px 4px; }
  .card { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-2); font-size: 13px; color: var(--muted); }
  .card-head .who { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--ink-2); }
  .card-head .who .mark { width: 22px; height: 22px; border-radius: 6px; }
  .card-head .who .mark svg { width: 13px; height: 13px; }
  .card-head .spacer { flex: 1; }
  .icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 3px 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; }
  .icon-btn:hover { background: var(--line-2); color: var(--ink); }
  .icon-btn svg { width: 14px; height: 14px; }
  .card-body { padding: 14px 18px 16px; }
  .rewritten { font-size: 13px; color: var(--muted); margin: 0 0 10px; padding: 6px 10px; background: var(--panel-2); border-radius: 8px; border: 1px dashed var(--line); }
  .answer h3, .answer h4 { font-size: 16px; margin: 14px 0 4px; }
  .answer p { margin: 0 0 10px; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-inline-start: 22px; }
  .answer li { margin: 2px 0; }
  .answer hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .cite { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; margin: 0 2px; border-radius: 5px; cursor: pointer; vertical-align: 1px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); font-size: 11.5px; font-weight: 700; line-height: 1; font-family: "Inter", sans-serif; }
  .cite:hover { background: var(--accent); color: var(--accent-ink); }

  /* Sources */
  .sources { border-top: 1px solid var(--line-2); background: var(--panel-2); }
  .sources > summary { list-style: none; cursor: pointer; padding: 10px 18px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .sources > summary::-webkit-details-marker { display: none; }
  .sources > summary .chev { transition: transform .15s; width: 14px; height: 14px; color: var(--muted); }
  .sources[open] > summary .chev { transform: rotate(90deg); }
  html[dir=rtl] .sources:not([open]) > summary .chev { transform: rotate(180deg); }
  .sources > summary .count { font-weight: 400; color: var(--muted); }
  .src-list { padding: 0 14px 14px; display: grid; gap: 8px; }
  .src { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 10px 13px; font-size: 13.8px; line-height: 1.65; transition: background .3s, border-color .3s; }
  .src.cited { border-inline-start: 3px solid var(--accent); }
  .src.flash { background: var(--accent-soft); border-color: var(--accent-line); }
  .src-top { display: flex; gap: 8px; align-items: baseline; }
  .src .n { flex: none; font-weight: 700; color: var(--accent); font-family: "Inter", sans-serif; font-size: 12.5px; }
  .src .cit { font-weight: 600; color: var(--ink); }
  .src .desc { color: var(--muted); margin-top: 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { font-size: 12px; border-radius: 6px; padding: 1px 8px; border: 1px solid; line-height: 1.6; }
  .badge.bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
  .badge.warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
  .badge.ok { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .src-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 6px; font-size: 12.5px; }
  .src-foot a { text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
  .src-foot a:hover { text-decoration: underline; }
  .src-foot a svg { width: 13px; height: 13px; }
  .src details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .src details div { color: var(--ink-2); font-size: 13px; white-space: pre-wrap; margin-top: 6px; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; max-height: 220px; overflow: auto; unicode-bidi: plaintext; }

  /* Loading */
  .steps { display: grid; gap: 8px; padding: 4px 0; font-size: 14px; color: var(--muted); }
  .step { display: flex; align-items: center; gap: 10px; }
  .step .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .step.active { color: var(--ink); }
  .step.active .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step.done .dot { background: var(--accent); border-color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--bad); background: var(--bad-soft); border: 1px solid var(--bad-line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }

  /* Composer */
  footer { padding: 10px 0 14px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .composer { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: var(--shadow); }
  .composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; max-height: 160px; padding: 7px 8px; line-height: 1.6; unicode-bidi: plaintext; }
  .send { flex: none; width: 40px; height: 40px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 11px; cursor: pointer; }
  .send:hover { background: var(--accent-2); }
  .send:disabled { opacity: .4; cursor: default; }
  .send svg { width: 18px; height: 18px; }
  html[dir=rtl] .send svg { transform: scaleX(-1); }
  .opts { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); padding: 8px 6px 0; }
  .opts label { cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .opts select { font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
  .opts input { accent-color: var(--accent); margin: 0; }
  .opts .note { margin-inline-start: auto; }

  @media (max-width: 640px) {
    .bar { padding: 8px 14px; gap: 8px; } .brand small, .ghost .txt { display: none; }
    .col { padding: 0 14px; } .welcome { padding: 3vh 0 2vh; } .welcome .lead { font-size: 15px; }
    .opts .note { display: none; } .card-body { padding: 12px 14px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-scales" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 20h10M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z"/></symbol>

<header>
  <div class="bar">
    <a class="brand" href="./">
      <span class="mark"><svg style="color:#fff"><use href="#i-scales"/></svg></span>
      <span><b>EasyLaw</b><small data-t="tagline"></small></span>
    </a>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Interface language">
      <button type="button" data-ui="fr">FR</button>
      <button type="button" data-ui="ar">عربي</button>
    </div>
    <button class="ghost" id="reset" type="button"><svg><use href="#i-plus"/></svg><span class="txt" data-t="new"></span></button>
    <a class="ghost" id="repo" href="https://github.com/MehdiBedja/easylaw-rag" target="_blank" rel="noopener" aria-label="GitHub"><svg><use href="#i-gh"/></svg><span class="txt">GitHub</span></a>
  </div>
</header>

<div class="banner" id="banner"><div data-t="starting"></div></div>

<main id="scroll">
  <div class="col">
    <section class="welcome" id="welcome">
      <span class="eyebrow" data-t="eyebrow"></span>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <ul class="features">
        <li><svg><use href="#i-check"/></svg><span data-t="f1"></span></li>
        <li><svg><use href="#i-check"/></svg><span data-t="f2"></span></li>
        <li><svg><use href="#i-check"/></svg><span data-t="f3"></span></li>
      </ul>
      <p class="label" data-t="try"></p>
      <div class="examples" id="examples"></div>
    </section>
    <div class="thread" id="chat"></div>
  </div>
</main>

<footer>
  <div class="col">
    <form class="composer" id="form">
      <textarea id="q" rows="1" autofocus></textarea>
      <button class="send" id="send" type="submit" aria-label="Send"><svg><use href="#i-send"/></svg></button>
    </form>
    <div class="opts">
      <label><span data-t="corpus"></span> <select id="lang"><option value="auto" data-t="auto"></option><option value="ar">العربية</option><option value="fr">Français</option></select></label>
      <label><input type="checkbox" id="inforce"> <span data-t="inforce"></span></label>
      <label><input type="checkbox" id="admin"> <span data-t="admin"></span></label>
      <span class="note" data-t="note"></span>
    </div>
  </div>
</footer>

<script>

    steps: ["البحث في 850 ألف مقطع", "ترتيب المواد الأكثر صلة", "صياغة الإجابة"],
    answer: "الإجابة", copy: "نسخ", copied: "تم النسخ", understood: "السؤال كما فُهم:",
    sources: "المصادر", cited: (c, n) => `${c} مستشهد بها من أصل ${n}`, articles: "المواد", excerpt: "مقتطف من النص", pdf: "الجريدة الرسمية (PDF)", citedTag: "مستشهد به",
    starting: "الخدمة قيد التشغيل (تحميل النماذج، من دقيقة إلى ثلاث دقائق). يمكنك كتابة سؤالك الآن.",
    error: "تعذر الحصول على إجابة:",
    examples: [
      ["AR", "كم عدد أيام العطلة السنوية المدفوعة الأجر للعامل؟"],
      ["AR", "ما هي عقوبة السرقة في قانون العقوبات؟"],
      ["AR", "من يحق له تأسيس منظمة نقابية؟"],
      ["FR", "À partir de quel âge peut-on se marier ?"],
    ],
  },
};
const SRC = {  // labels inside an answer follow the language of the answer, not of the interface
  fr: UI.fr, ar: UI.ar,
};

const $ = id => document.getElementById(id);
const chat = $("chat"), scroller = $("scroll"), form = $("form"), q = $("q"), send = $("send");
let history = [], busy = false, ready = false;
let ui = (() => { try { return localStorage.getItem("ui") } catch { return null } })()
  || ((navigator.language || "").startsWith("ar") ? "ar" : "fr");

function applyUI(lang) {
  ui = lang; const t = UI[lang];
  try { localStorage.setItem("ui", lang); } catch {}
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-ui]").forEach(b => b.setAttribute("aria-pressed", b.dataset.ui === lang));
  q.placeholder = t.placeholder;
  $("examples").innerHTML = t.examples.map(([tag, text]) =>
    `<button type="button"><span class="tag">${tag}</span><span dir="auto">${esc(text)}</span></button>`).join("");
}

// Some scraped titles carry Windows-1252 punctuation decoded as C1 control characters (e.g. U+0092 for ’).
const C1 = { "\u0091": "‘", "\u0092": "’", "\u0093": "“", "\u0094": "”", "\u0096": "–", "\u0097": "—" };
const esc = s => String(s).replace(/[\u0080-\u009f]/g, c => C1[c] || "")
  .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function inline(s, id) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/\[(\d+)\]/g, (_, n) => `<button type="button" class="cite" data-src="${id}-${n}">${n}</button>`);
}

// Minimal markdown: headings, bullet/numbered lists, rules, paragraphs.
function render(md, id) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.split("\n")) {
    const line = raw.trim(); let m;
    if (!line) { close(); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line)) { close(); out.push("<hr>"); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { close(); const h = m[1].length < 3 ? 3 : 4; out.push(`<h${h}>${inline(m[2], id)}</h${h}>`); }
    else if ((m = line.match(/^[*\-•]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1], id)}</li>`); }
    else if ((m = line.match(/^\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1], id)}</li>`); }
    else { close(); out.push(`<p>${inline(line, id)}</p>`); }
  }
  close();
  return out.join("");
}

function add(cls, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  chat.appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

function badge(text) {
  const repealed = text.startsWith("⚠️");
  return `<span class="badge ${repealed ? "bad" : "warn"}">${esc(text.replace(/^⚠️\s*/, ""))}</span>`;
}

function sourcesHtml(sources, id, t) {
  const cited = sources.filter(s => s.cited).length;
  const items = sources.map(s => `
    <div class="src ${s.cited ? "cited" : ""}" id="src-${id}-${s.n}">
      <div class="src-top"><span class="n">[${s.n}]</span><span class="cit">${esc(s.citation)}</span></div>
      ${s.description ? `<div class="desc">${esc(s.description)}</div>` : ""}
      ${(s.status || []).length ? `<div class="badges">${s.status.map(badge).join("")}</div>` : ""}
      <div class="src-foot">
        ${s.articles && s.articles.length ? `<span class="desc">${t.articles} : ${esc(s.articles.slice(0, 10).join(", "))}</span>` : ""}
        ${s.pdf_url ? `<a href="${esc(s.pdf_url)}" target="_blank" rel="noopener"><svg><use href="#i-file"/></svg>${t.pdf}</a>` : ""}
      </div>
      ${s.excerpt ? `<details><summary>${t.excerpt}</summary><div>${esc(s.excerpt)}…</div></details>` : ""}
    </div>`).join("");
  return `<details class="sources" ${cited ? "open" : ""}><summary><svg class="chev"><use href="#i-chev"/></svg>${t.sources}<span class="count">· ${t.cited(cited, sources.length)}</span></summary><div class="src-list">${items}</div></details>`;
}

function cardHead(t, extra = "") {
  return `<div class="card-head"><span class="who"><span class="mark"><svg style="color:#fff"><use href="#i-scales"/></svg></span>EasyLaw</span>${extra}</div>`;
}

function loading() {
  const t = UI[ui];
  const el = add("bot", `<div class="card">${cardHead(t)}<div class="card-body"><div class="steps">${t.steps.map(s => `<div class="step"><span class="dot"></span>${esc(s)}</div>`).join("")}</div></div></div>`);
  const steps = el.querySelectorAll(".step"); let i = 0;
  const tick = () => { steps.forEach((s, j) => s.className = "step" + (j < i ? " done" : j === i ? " active" : "")); };
  tick();
  // Rough timings of the real pipeline: search ~1 s, rerank ~10 s, then generation.
  const timers = [setTimeout(() => { i = 1; tick(); }, 1200), setTimeout(() => { i = 2; tick(); }, 12000)];
  return { el, stop: () => timers.forEach(clearTimeout) };
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; send.disabled = true;
  $("welcome")?.remove();
  add("user", `<div class="bubble">${esc(question)}</div>`);
  const load = loading();
  const id = Date.now();
  try {
    const res = await fetch("api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question, history: history.slice(-3),
        in_force_only: $("inforce").checked, include_administrative: $("admin").checked, lang: $("lang").value,
      }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const a = await res.json();
    const t = SRC[a.lang] || UI.ar, tm = a.timings || {};
    const meta = `<span class="spacer"></span><span title="search ${((tm.encode || 0) + (tm.search || 0)).toFixed(1)}s · rerank ${tm.rerank ?? "-"}s · generate ${tm.generate ?? "-"}s">${a.seconds}s</span>
      <button type="button" class="icon-btn copy"><svg><use href="#i-copy"/></svg><span>${t.copy}</span></button>`;
    load.stop();
    load.el.innerHTML = `<div class="card" dir="${a.lang === "fr" ? "ltr" : "rtl"}" lang="${a.lang}">${cardHead(t, meta)}
      <div class="card-body">
        ${a.standalone ? `<div class="rewritten">${t.understood} ${esc(a.standalone)}</div>` : ""}
        <div class="answer">${render(a.answer, id)}</div>
      </div>
      ${a.sources.length ? sourcesHtml(a.sources, id, t) : ""}
    </div>`;
    load.el.querySelector(".copy").addEventListener("click", e => {
      navigator.clipboard?.writeText(a.answer).then(() => { e.currentTarget.querySelector("span").textContent = t.copied; }).catch(() => {});
    });
    history.push({ question, answer: a.answer });
  } catch (e) {
    load.stop();
    load.el.innerHTML = `<div class="error">${esc(UI[ui].error)} ${esc(String(e.message || e))}</div>`;
  }
  busy = false; send.disabled = false; q.focus();
}

form.addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; ask(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
document.addEventListener("click", e => {
  const ex = e.target.closest(".examples button");
  if (ex) return ask(ex.querySelector("[dir]").textContent);
  const lang = e.target.closest("[data-ui]");
  if (lang) return applyUI(lang.dataset.ui);
  const c = e.target.closest(".cite");
  if (c) {
    const el = $("src-" + c.dataset.src);
    if (el) { el.closest("details").open = true; el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
  }
});
$("reset").addEventListener("click", () => location.reload());

// Cold start (online demo): the page is served before the models finish loading.
async function poll() {
  try { ready = (await (await fetch("api/health")).json()).ready; } catch { ready = false; }
  $("banner").classList.toggle("on", !ready);
  if (!ready) setTimeout(poll, 4000);
}
applyUI(ui);
poll();
</script>
</body>
</html>
