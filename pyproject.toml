[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easylaw-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over Algerian legal texts (Journal Officiel)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "FlagEmbedding>=1.3",      # BGE-M3 encoder + bge-reranker-v2-m3 (pulls torch and transformers)
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
app = ["fastapi>=0.115", "uvicorn>=0.30"]
scrape = ["httpx>=0.27", "pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easylaw_rag = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
